#################################
#           Corners             #
#################################

rounded-corners = true;
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'Polybar'",
  "window_type = 'desktop'",
  "window_type = 'tooltip'", 
  "window_type = 'popup_menu'", 
  "window_type = 'dropdown_menu'", 
  "window_type = 'utility'"
];

#################################
#           Shadows             #
#################################

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.75;
shadow-offset-x = -12;
shadow-offset-y = -12;

# Everforest-inspired shadow color (dark green tint)
shadow-color = "#2D353B"

shadow-exclude = [
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "class_g = 'Cairo-clock'"
  # Removed "name = 'Notification'" to allow shadows on notifications
];

#################################
#           Fading              #
#################################

#fading = true;
#fade-in-step = 0.03;
#fade-out-step = 0.03;
#fade-delta = 5;

fade-exclude = []

#################################
#   Transparency / Opacity      #
#################################

# inactive-opacity = 0.95;
# frame-opacity = 0.95;
# inactive-opacity-override = false;
# active-opacity = 0.95;  # Match inactive-opacity to avoid focus effect

inactive-opacity = 1;
frame-opacity = 1;
inactive-opacity-override = false;
active-opacity = 1;  # Match inactive-opacity to avoid focus effect


# Everforest dim inactive windows for better focus
focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'Firefox'"
];

opacity-rule = [
  # "95:class_g = 'Nemo' && !focused", # For some reason nemo doesn't recognize it's unfocused
  # "95:class_g = 'Nemo' && focused",
  # "95:class_g = 'Polybar'",
  # "95:class_g = 'kitty'",       # Same opacity regardless of focus
  # "95:class_g = 'zen'",
  # "95:class_g = 'Firefox'",     # Same opacity regardless of focus
  "100:class_g = 'Brave-browser'",     # Same opacity regardless of focus
  "100:class_g = 'Screenhider'",     # Same opacity regardless of focus
  "99:class_g = 'Rofi'",
  # "99:class_g = 'Dunst'",
  # "99:name = 'Notification'",
  "99:class_g ?= 'Notify-osd'"
  # Both focused and unfocused windows will have blur via the global blur settings
];

#################################
#     Background-Blurring       #
#################################

blur: {
  method = "dual_kawase";
  strength = 3;
  background = true;
  background-frame = true;
  background-fixed = true;
  kern = "3x3box";      # Added kernel for stronger effect
}

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Rofi'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'Gromit-mpx'"
  # No exclusion for notifications, allowing them to be blurred
];

#################################
#   Fix common i3 scroll bug    #
#################################

vsync = true;
