;; ┌────────────────────────────────────────────────────────────────┐
;; │ POLYBAR ISLANDS THEME - Modules                                │
;; │ Each module styled as a floating island with rounded corners   │
;; └────────────────────────────────────────────────────────────────┘

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;;                    SYSTEM
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/cpu]
type = internal/cpu

interval = 2

format = <label>
format-prefix = "󰍛 "
format-prefix-font = 2
format-prefix-foreground = ${color.cyan}
format-foreground = ${color.foreground}
format-padding = 0

label = %percentage%%

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/memory]
type = internal/memory

interval = 2

format = <label>
format-prefix = "󰘚 "
format-prefix-font = 2
format-prefix-foreground = ${color.purple}
format-foreground = ${color.foreground}
format-padding = 0

label = %percentage_used%%

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;;                  WORKSPACES
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/i3]
type = internal/i3

; Only show workspaces on same output
pin-workspaces = true

; Sort by index
index-sort = true

; Enable click/scroll
enable-click = true
enable-scroll = false

; Wrap around
wrapping-scroll = false

; Reverse scroll direction
reverse-scroll = false

; Fuzzy matching for icons
fuzzy-match = true

; Workspace icons
ws-icon-0 = 1;󰲠
ws-icon-1 = 2;󰲢
ws-icon-2 = 3;󰲤
ws-icon-3 = 4;󰲦
ws-icon-4 = 5;󰲨
ws-icon-5 = 6;󰲪
ws-icon-6 = 7;󰲬
ws-icon-7 = 8;󰲮
ws-icon-8 = 9;󰲰
ws-icon-9 = 10;󰿬
ws-icon-default = 󰑊

; Workspace styling
format = <label-state> <label-mode>
format-padding = 0

; Mode label (resize, etc.)
label-mode = %mode%
label-mode-padding = 1
label-mode-foreground = ${color.foreground}
label-mode-background = ${color.red}

; Focused workspace
label-focused = %icon%
label-focused-font = 2
label-focused-foreground = ${color.primary}
label-focused-padding = 1

; Unfocused workspace
label-unfocused = %icon%
label-unfocused-font = 2
label-unfocused-foreground = ${color.foreground-dim}
label-unfocused-padding = 1

; Visible workspace (on other monitor)
label-visible = %icon%
label-visible-font = 2
label-visible-foreground = ${color.foreground}
label-visible-padding = 1

; Urgent workspace
label-urgent = %icon%
label-urgent-font = 2
label-urgent-foreground = ${color.foreground-dim}
label-urgent-padding = 1

; Separator between workspaces
label-separator = " "

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;;                  VOLUME
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/pulseaudio]
type = internal/pulseaudio

use-ui-max = true
interval = 5

; Scroll to change volume
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

; Volume format
format-volume = <ramp-volume> <label-volume>
format-volume-foreground = ${color.foreground}
format-volume-padding = 1

; Muted format
format-muted = <label-muted>
format-muted-prefix = "󰖁 "
format-muted-prefix-foreground = ${color.red}
format-muted-prefix-font = 2
format-muted-foreground = ${color.foreground-dim}
format-muted-padding = 1

; Labels
label-volume = %percentage%%
label-muted = Muted

; Volume ramp icons (using font-1 for larger size)
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${color.foreground}
ramp-volume-font = 2

; Click to open mixer
click-right = pavucontrol &
click-middle = pactl set-sink-mute @DEFAULT_SINK@ toggle

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;;                 KEYBOARD
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/keyboard]
type = internal/xkeyboard

; Ignore indicators
blacklist-0 = num lock
blacklist-1 = scroll lock

format = <label-layout>
format-prefix = "󰌌 "
format-prefix-font = 2
format-prefix-foreground = ${color.orange}
format-foreground = ${color.foreground}
format-padding = 1

label-layout = %layout%

; Indicator styling (caps lock, etc.)
label-indicator-on = %name%
label-indicator-on-foreground = ${color.red}
label-indicator-padding = 1

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;;                DATE & TIME
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/date]
type = internal/date

interval = 1

; Static date and time format
date = %a %d %b
time = %H:%M

format = <label>
format-prefix = " "
format-prefix-font = 2
format-prefix-foreground = ${color.primary}
format-foreground = ${color.foreground}
format-padding = 0

label = "%{A1:~/.config/polybar/islands/scripts/open-calendar.sh &:}%date% %time% %{A}"

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;;                SEPARATORS
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/sep]
type = custom/text
content = "  "

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;;                SYSTEM TRAY
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/tray]
type = internal/tray

tray-spacing = 8px
tray-padding = 2px
tray-size = 65%